[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "disklens"
version = "0.1.0"
description = "Offline, risk-aware CLI filesystem intelligence"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["typer>=0.12,<1", "rich>=13,<15", "numpy>=1.24,<3", "scipy>=1.11,<2", "pandas>=2,<3", "scikit-learn>=1.6,<1.8", "joblib>=1.3,<2"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9"]
windows = ["pywin32>=306; sys_platform == 'win32'"]
advanced = ["xgboost>=2,<4", "matplotlib>=3.8,<4"]

[project.scripts]
disklens = "disklens.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 110
